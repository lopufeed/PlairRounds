<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131f" />
    <meta name="description" content="Небольшая браузерная игра для телефона и компьютера." />
    <title>Поймай звёзды</title>
    <!-- Для подтверждения авторства PLAIR добавь сюда: <meta name="plair-verify" content="plair-ТВОЙ-КОД"> -->
    <!-- Для отправки очков подключи SDK: <script src="https://plair.pro/sdk.js"></script> -->
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div><p class="eyebrow">МИНИ-ИГРА</p><h1>Поймай звёзды</h1></div>
        <div class="score-box" aria-live="polite"><span>Счёт</span><strong id="score">0</strong></div>
      </header>
      <section class="stage" aria-label="Игровое поле">
        <canvas id="game" aria-label="Лови падающие звёзды корзиной"></canvas>
        <div class="overlay" id="overlay">
          <div class="card"><span class="sparkle">✦</span><h2 id="message-title">Готов играть?</h2><p id="message-copy">Двигай корзину и лови звёзды. На телефоне перетаскивай пальцем.</p><button id="start">Играть</button></div>
        </div>
      </section>
      <footer><span>← → или A / D</span><span>На телефоне — свайп</span><button class="quiet-button" id="restart" type="button">Начать заново</button></footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
